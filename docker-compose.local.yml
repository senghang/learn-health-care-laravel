services:
  postgres:
    image: postgres:16
    container_name: tenant-clinic-postgres
    restart: always
    environment:
      POSTGRES_DB: tenant_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - tenant_clinic_pg:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: tenant-clinic-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  tenant_clinic_pg:
